<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ima Kome Treba</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; padding: 15px; }
        .container { background: #fff; padding: 25px; border-radius: 10px; max-width: 400px; margin: 20px auto; }
        h2 { text-align: center; margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; }
        input, button { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 5px; }
        button { background-color: #28a745; color: white; border: none; font-weight: bold; cursor: pointer; }
        
        /* Sekcija za sponzore */
        .sponsors-section { text-align: center; margin-top: 40px; padding: 20px; background: #fff; border-radius: 10px; max-width: 600px; margin-left: auto; margin-right: auto; }
        .sponsors-grid { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 20px; margin-top: 15px; }
        .sponsor-item img { max-width: 120px; height: auto; opacity: 0.85; transition: 0.3s; border-radius: 5px; }
        .sponsor-item img:hover { opacity: 1; transform: scale(1.05); }
    </style>
</head>
<body>

<div class="container">
    <h2>Registracija</h2>
    <form action="/register" method="POST">
        <div class="form-group">
            <label for="username">Korisničko ime</label>
            <input type="text" id="username" name="username" required>
        </div>
        <div class="form-group">
            <label for="password">Lozinka</label>
            <input type="password" id="password" name="password" required>
        </div>
        <button type="submit">Registruj se</button>
    </form>
</div>

<!-- Sekcija sa 2 sponzora -->
<div class="sponsors-section">
    <h3>Sponzori i Prijatelji</h3>
    <div class="sponsors-grid">
        <!-- Prvi sponzor -->
        <div class="sponsor-item">
            <a href="https://sajt-prvog-sponzora.com" target="_blank">
                <img src="/static/logo.jpg" alt="Sponzor 1">
            </a>
        </div>
        <!-- Drugi sponzor -->
        <div class="sponsor-item">
            <a href="https://sajt-drugog-sponzora.com" target="_blank">
                <img src="/static/logo.jpg" alt="Sponzor 2">
            </a>
        </div>
    </div>
</div>

</body>
</html>
